experiment_name: eae_ir_gemini

dataset:
  name: rams
  data_dir: datasets/RAMS/data
  split: dev
  max_samples: 3

model:
  name: ir_pipeline
  backend: gemini
  llm_name_env: GEMINI_MODEL
  api_key_env: GEMINI_API_KEY
  dotenv_path: dotenv/.env
  temperature: 0.0
  timeout_seconds: 120

evaluation:
  validators: [strict]
  metrics: [strict_rates]
