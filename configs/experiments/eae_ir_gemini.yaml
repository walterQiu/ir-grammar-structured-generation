experiment_name: eae_ir_gemini

dataset:
  name: rams
  data_dir: datasets/RAMS/data
  split: dev
  max_samples: 3

model:
  name: ir_pipeline
  extraction_model:
    backend: gemini
    llm_name: gemini-2.5-flash-lite
    api_key_env: GEMINI_API_KEY
    dotenv_path: dotenv/.env
    temperature: 0.0
    timeout_seconds: 120
  ir_model:
    backend: gemini
    llm_name: gemini-2.5-flash-lite
    api_key_env: GEMINI_API_KEY
    dotenv_path: dotenv/.env
    temperature: 0.0
    timeout_seconds: 120

evaluation:
  validators: [strict]
  metrics: [strict_rates, arg_i_f1, arg_c_f1]
