experiment_name: rams_baseline_gemini_3_pro_preview

dataset:
  name: rams
  data_dir: datasets/RAMS/data
  split: dev
  max_samples: 100

model:
  name: baseline
  backend: gemini
  llm_name: gemini-3-pro-preview
  api_key_env: GEMINI_API_KEY
  dotenv_path: dotenv/.env
  temperature: 0.0
  timeout_seconds: 300
  enable_sleep: true
  sleep_seconds: 1.0
  enable_retry: true
  max_retries: 5
  backoff_initial_seconds: 2.0
  backoff_multiplier: 2.0
  backoff_max_seconds: 32.0
  retry_http_statuses: [429, 500, 502, 503, 504]

evaluation:
  validators: [strict]
  metrics: [strict_rates, arg_i_f1, arg_c_f1, content_similarity_sbert, bemeae]
