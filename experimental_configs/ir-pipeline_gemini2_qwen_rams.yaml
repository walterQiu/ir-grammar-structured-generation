experiment_name: ir-pipeline_gemini2_qwen_rams
dataset:
  name: rams
  data_dir: datasets/RAMS/data
  split: dev
  max_samples: 100
model:
  name: ir_pipeline
  extraction_model:
    backend: gemini
    llm_name: gemini-2.5-flash-lite
    api_key_env: GEMINI_API_KEY
    enable_sleep: true
    enable_retry: true
  ir_model:
    backend: vllm
    llm_name: Qwen/Qwen2.5-7B-Instruct
    api_base: http://140.118.155.118:8000/v1
    enable_sleep: false
    enable_retry: true
  ir_grammar: dot_notation_ir
evaluation:
  metrics:
  - is_valid_json
  - is_valid_ir
  - schema_exact_match
  - exact_match
  - arg_i_f1
  - arg_c_f1
  - content_similarity_sbert
  - bemeae
  - json_structure_f1
