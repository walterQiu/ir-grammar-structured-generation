experiment_name: two-stage-json_qwen_mistral_rams
dataset:
  name: rams
  data_dir: datasets/RAMS/data
  split: dev
  max_samples: 100
model:
  name: two_stage
  extraction_model:
    backend: vllm
    llm_name: Qwen/Qwen2.5-7B-Instruct
    api_base: http://140.118.155.118:8000/v1
    enable_sleep: false
    enable_retry: true
  ir_model:
    backend: vllm
    llm_name: mistralai/Mistral-7B-Instruct-v0.3
    api_base: http://140.118.155.118:8001/v1
    enable_sleep: false
    enable_retry: true
  ir_grammar: json
evaluation:
  metrics:
  - schema_exact_match
  - exact_match
  - arg_i_f1
  - arg_c_f1
  - content_similarity_sbert
  - bemeae
  - json_structure_f1
