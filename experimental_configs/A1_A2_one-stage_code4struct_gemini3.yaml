experiment_name: A1_A2_one-stage_code4struct_gemini3
dataset:
  name: rams
  data_dir: datasets/RAMS/data
  split: test
model:
  name: one_stage
  stage_model:
    backend: gemini
    llm_name: gemini-3.1-pro-preview
    api_key_env: GEMINI_API_KEY
    enable_sleep: true
    enable_retry: true
  ir_grammar: code4struct_ir
  apply_icl: true
evaluation:
  metrics:
  - is_valid_ir
  - schema_exact_match
  - arg_i_f1
  - arg_c_f1
  - content_similarity_sbert
  - bemeae
  - json_structure_f1
