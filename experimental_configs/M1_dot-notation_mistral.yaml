experiment_name: M1_dot-notation_mistral
dataset:
  name: rams
  data_dir: datasets/RAMS/data
  split: test
model:
  name: two_stage
  extraction_model:
    backend: gemini
    llm_name: gemini-3-pro-preview
    api_key_env: GEMINI_API_KEY
    enable_sleep: true
    enable_retry: true
  ir_model:
    backend: vllm
    llm_name: mistralai/Mistral-7B-Instruct-v0.3
    api_base: http://140.118.155.118:8001/v1
    enable_sleep: false
    enable_retry: true
  ir_grammar: dot_notation_ir
evaluation:
  metrics:
  - is_valid_ir
  - schema_exact_match
  - exact_match
  - arg_i_f1
  - arg_c_f1
  - content_similarity_sbert
  - bemeae
  - json_structure_f1
