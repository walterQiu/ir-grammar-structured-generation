experiment_name: two-stage-baseline_gemini2_gemini3_rams
dataset:
  name: rams
  data_dir: datasets/RAMS/data
  split: dev
  max_samples: 100
model:
  name: two_stage_baseline
  extraction_model:
    backend: gemini
    llm_name: gemini-2.5-flash-lite
    api_key_env: GEMINI_API_KEY
    enable_sleep: true
    enable_retry: true
  schema_model:
    backend: gemini
    llm_name: gemini-3-pro-preview
    api_key_env: GEMINI_API_KEY
    enable_sleep: true
    enable_retry: true
evaluation:
  metrics:
  - is_valid_json
  - schema_exact_match
  - exact_match
  - arg_i_f1
  - arg_c_f1
  - content_similarity_sbert
  - bemeae
  - json_structure_f1
