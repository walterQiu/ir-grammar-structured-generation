experiment_name: development_used_two_stage_baseline_vllm_mistral_7b_instruct_v0_3

dataset:
  name: rams
  data_dir: datasets/RAMS/data
  split: dev
  max_samples: 3

model:
  name: two_stage_baseline
  extraction_model:
    backend: vllm
    llm_name: mistralai/Mistral-7B-Instruct-v0.3
    api_base: http://140.118.155.118:8001/v1
    enable_sleep: false
    enable_retry: true
  schema_model:
    backend: vllm
    llm_name: mistralai/Mistral-7B-Instruct-v0.3
    api_base: http://140.118.155.118:8001/v1
    enable_sleep: false
    enable_retry: true

evaluation:
  validators: [strict]
  metrics: [strict_rates, arg_i_f1, arg_c_f1, content_similarity_sbert, bemeae]
