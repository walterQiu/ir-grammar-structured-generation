experiment_name: A1_two-stage_json_mistral
dataset:
  name: rams
  data_dir: datasets/RAMS/data
  split: test
model:
  name: two_stage
  extraction_model:
    backend: vllm
    llm_name: mistralai/Mistral-7B-Instruct-v0.3
    api_base: http://140.118.155.118:8001/v1
    enable_sleep: false
    enable_retry: true
  ir_model:
    backend: vllm
    llm_name: mistralai/Mistral-7B-Instruct-v0.3
    api_base: http://140.118.155.118:8001/v1
    enable_sleep: false
    enable_retry: true
  ir_grammar: json
  apply_icl: true
evaluation:
  metrics:
  - is_valid_ir
  - arg_i_f1
  - arg_c_f1
  - content_similarity_sbert
  - bemeae
  - ecar
