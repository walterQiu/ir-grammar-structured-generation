experiment_name: development_used
dataset:
  name: rams
  data_dir: datasets/RAMS/data
  split: dev
  max_samples: 4
model:
  name: two_stage
  extraction_model:
    backend: gemini
    llm_name: gemini-3.1-pro-preview
    api_key_env: GEMINI_API_KEY
    enable_sleep: true
    enable_retry: true
  ir_model:
    backend: gemini
    llm_name: gemini-3.1-pro-preview
    api_key_env: GEMINI_API_KEY
    enable_sleep: true
    enable_retry: true
  ir_grammar: json
  apply_icl: true
evaluation:
  metrics:
  - is_valid_ir
  - non_absence_role_fallback_json
  - schema_exact_match
  - exact_match
  - arg_i_f1
  - arg_c_f1
  - content_similarity_sbert
  - bemeae
  - json_structure_f1
